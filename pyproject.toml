[project]
name = "predictive-machine-guard"
version = "1.0.0"
description = "Predictive-Machine Guard: Applied Machine Learning Platform for Industrial Predictive Maintenance, RUL Estimation, Multi-Model Benchmarking, and Explainable AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "joblib>=1.3.2",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
